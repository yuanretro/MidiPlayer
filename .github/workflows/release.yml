name: Build and Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0 (creates the tag and release). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Temurin builds are linked against an old glibc, so the bundled runtime
      # runs on most Linux distributions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || -n "$INPUT_VERSION" ]]; then
            export VERSION="${RELEASE_VERSION}"
          else
            export VERSION="dev-${GITHUB_SHA::7}"
          fi
          ./build.sh

      - name: Smoke test bundle
        run: |
          mkdir smoke
          tar -C smoke -xzf dist/*.tar.gz
          printf '/dev/null\nexit\n' | smoke/*/bin/midiplayer-cli

      - name: Remove duplicate jar
        if: matrix.arch != 'x86_64'
        run: rm dist/MidiPlayer.jar

      - uses: actions/upload-artifact@v4
        with:
          name: midiplayer-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: MidiPlayer ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            ## Downloads

            | File | Description |
            | --- | --- |
            | `MidiPlayer-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz` | Self-contained, Java included (Intel/AMD 64-bit) |
            | `MidiPlayer-${{ env.RELEASE_VERSION }}-linux-aarch64.tar.gz` | Self-contained, Java included (ARM 64-bit, e.g. Raspberry Pi 4/5 64-bit OS) |
            | `MidiPlayer.jar` | Needs Java 8 or newer installed: `java -jar MidiPlayer.jar` |

            ## Usage

            ```sh
            tar xzf MidiPlayer-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
            cd MidiPlayer-${{ env.RELEASE_VERSION }}-linux-x86_64
            ./bin/midiplayer        # GUI
            ./bin/midiplayer-cli    # text mode
            ```

            Requires `aplaymidi` (package `alsa-utils`) and a MIDI output
            (hardware synth, or a software synth such as TiMidity++ / FluidSynth).
