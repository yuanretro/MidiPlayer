name: Build and Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v1.0.0 (creates the tag and release). Leave empty to only build."
        required: false
        default: ""
      notes_only:
        description: "Only update the notes of an existing release, keep its files"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: windows-latest
            os: windows
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Temurin builds are linked against an old glibc, so the bundled runtime
      # runs on most Linux distributions
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || -n "$INPUT_VERSION" ]]; then
            export VERSION="${RELEASE_VERSION}"
          else
            export VERSION="dev-${GITHUB_SHA::7}"
          fi
          ./build.sh

      - name: Smoke test bundle
        if: matrix.os == 'linux'
        run: |
          mkdir smoke
          tar -C smoke -xzf dist/*.tar.gz
          printf '/dev/null\nexit\n' | smoke/*/bin/midiplayer-cli
          printf '\nhelp\nstatus\nport\n\n' | smoke/*/bin/midiplayer-cli

      - name: Smoke test Windows app
        if: matrix.os == 'windows'
        run: |
          mkdir smoke
          7z x -bso0 -osmoke dist/*.zip
          test -f smoke/*/MidiPlayer.exe
          # List the MIDI output devices with the bundled runtime
          smoke/*/runtime/bin/java.exe -cp "$(echo smoke/*/app/MidiPlayer.jar)" MidiPlayerJavaSound
          # Text mode launcher: list the ports, show the status, quit at the end of input
          printf '\nport\n\nstatus\n' | timeout 120 smoke/*/MidiPlayer-cli.exe

      - name: Remove duplicate jar
        if: matrix.os != 'linux' || matrix.arch != 'x86_64'
        run: rm dist/MidiPlayer.jar

      - uses: actions/upload-artifact@v4
        with:
          name: midiplayer-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: MidiPlayer ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          files: ${{ !inputs.notes_only && 'dist/*' || '' }}
          body: |
            ## Downloads

            | File | Description |
            | --- | --- |
            | `MidiPlayer-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz` | Self-contained, Java included (Intel/AMD 64-bit) |
            | `MidiPlayer-${{ env.RELEASE_VERSION }}-linux-aarch64.tar.gz` | Self-contained, Java included (ARM 64-bit, e.g. Raspberry Pi 4/5 64-bit OS) |
            | `MidiPlayer-${{ env.RELEASE_VERSION }}-windows-x86_64.zip` | Windows 64-bit, Java included: unzip and run `MidiPlayer.exe` (GUI) or `MidiPlayer-cli.exe` (text mode) |
            | `MidiPlayer.jar` | Needs Java 8 or newer installed: `java -jar MidiPlayer.jar` |

            ## Usage

            ```sh
            tar xzf MidiPlayer-${{ env.RELEASE_VERSION }}-linux-x86_64.tar.gz
            cd MidiPlayer-${{ env.RELEASE_VERSION }}-linux-x86_64
            ./bin/midiplayer        # GUI
            ./bin/midiplayer-cli    # text mode
            ```

            Windows: unzip and run `MidiPlayer.exe`, then choose any MIDI output device in the
            Port list, including hardware synthesizers / USB MIDI interfaces, Microsoft GS
            Wavetable Synth and virtual ports. `MidiPlayer-cli.exe` is the text mode.

            Text mode commands (Linux and Windows): `load [file]`, `play`, `stop`, `loop`,
            `port [n]`, `status`, `help`, `exit`. It remembers the port and folder like the GUI.

            ## System requirements

            | Package | Minimum |
            | --- | --- |
            | Windows zip | Windows 10 64-bit / Windows 11 / Windows Server 2016 or newer, x86_64 |
            | Linux tar.gz | glibc 2.17 or newer (RHEL/CentOS 7+, Debian 8+, Ubuntu 14.04+, ...), x86_64 or aarch64, `alsa-utils` installed, X11/XWayland desktop for the GUI |
            | `MidiPlayer.jar` | Java 8 or newer; on Linux also `alsa-utils` |

            Windows 7/8.1, 32-bit systems and Alpine Linux are not supported by the bundles, use
            `MidiPlayer.jar` with Java 8+ there. See the
            [README](https://github.com/yuanretro/MidiPlayer#system-requirements) for details.
